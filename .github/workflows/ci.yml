name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/e0-engineering-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lock
        name: Check lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile bootstrap is still pending; validation will run on the next push."
          fi
      - uses: actions/setup-node@v4
        if: steps.lock.outputs.exists == 'true'
        with:
          node-version: 24.21.0
      - if: steps.lock.outputs.exists == 'true'
        run: corepack enable
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm typecheck
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm lint
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm format:check
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm test:domain
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm test:unit
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm test:integration
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm build
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm check:browser-bundle

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lock
        name: Check lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.lock.outputs.exists == 'true'
        with:
          node-version: 24.21.0
      - if: steps.lock.outputs.exists == 'true'
        run: corepack enable
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm build
      - if: steps.lock.outputs.exists == 'true'
        run: pnpm test:e2e:smoke
