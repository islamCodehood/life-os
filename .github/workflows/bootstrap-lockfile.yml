name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/e0-engineering-foundation

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e0-engineering-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate pnpm lockfile"
          git push origin HEAD:feat/e0-engineering-foundation
