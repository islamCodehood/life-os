name: Format E0 branch

on:
  push:
    branches:
      - feat/e0-engineering-foundation

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e0-engineering-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Prettier formatting"
          git pull --rebase origin feat/e0-engineering-foundation
          git push origin HEAD:feat/e0-engineering-foundation
