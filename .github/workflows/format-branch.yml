name: Format feature branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to format
        required: true
  push:
    branches:
      - feat/e1-family-identity-sessions

permissions:
  contents: write

concurrency:
  group: e1-format
  cancel-in-progress: true

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e1-family-identity-sessions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(e1): apply Prettier formatting"
          git pull --rebase origin feat/e1-family-identity-sessions
          git push origin HEAD:feat/e1-family-identity-sessions
